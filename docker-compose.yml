services:
  # Edge proxy: terminates TLS, redirects HTTP->HTTPS and obtains Let's Encrypt
  # certificates automatically (HTTP-01 challenge on port 80).
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=30s
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=60s
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --ping=true
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - certificates:/certificates
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://localhost:8000/api/health/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      backend: {condition: service_healthy}
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
  # Application gateway: serves static/media from volumes and proxies the app.
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    networks: [edge]
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: portfolio-edge
      traefik.http.routers.web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.web.entrypoints: websecure
      traefik.http.routers.web.tls.certresolver: le
      traefik.http.routers.web.middlewares: security@file
      traefik.http.routers.api.rule: Host(`${DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/admin/`))
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: le
      traefik.http.routers.api.middlewares: security@file,private@file,ratelimit@file
      traefik.http.routers.api.priority: "20"
      traefik.http.routers.api.service: web
      traefik.http.services.web.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
networks:
  edge: {name: portfolio-edge}
  internal: {internal: true}
volumes:
  database:
  media:
  staticfiles:
  certificates:
