services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Local stack is served over plain HTTP by nginx, so DEBUG defaults to true.
      # docker-compose.prod.yml forces DEBUG=false for the Traefik/TLS deployment.
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      postgres: {condition: service_healthy}
    networks: [edge, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://localhost:8000/api/health/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      backend: {condition: service_healthy}
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
  # Application gateway: serves static/media from volumes and proxies the app.
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["80:8080"]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
networks:
  edge: {name: portfolio-edge}
  internal: {internal: true}
volumes:
  database:
  media:
  staticfiles:
