# Production gateway. Traefik terminates TLS (ACME) and forwards all traffic here.
# nginx serves Django static and uploaded media directly and proxies the rest:
#   /static/, /media/      -> local volumes (read-only)
#   /api/, /admin/         -> Django (Gunicorn)
#   everything else        -> React Router SSR
upstream portfolio_frontend {
  server frontend:3000;
}
upstream portfolio_backend {
  server backend:8000;
}

# Preserve the client scheme/IP added by the trusted upstream proxy (Traefik),
# falling back to the direct connection when nginx is used on its own.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}
map $http_x_forwarded_for $forwarded_for {
  default $http_x_forwarded_for;
  ''      $remote_addr;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 20m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  # Django admin / DRF assets, collected into a shared volume by the backend.
  location ^~ /static/ {
    alias /srv/static/;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  # Uploaded media.
  location ^~ /media/ {
    alias /srv/media/;
    autoindex off;
    access_log off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=86400" always;
  }

  location ~ ^/(api|admin)/ {
    proxy_pass http://portfolio_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://portfolio_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }
}
