# Local gateway that fronts the whole production topology behind plain nginx.
# Routes: /api/, /admin/, /static/ -> Django (Gunicorn); /media/ -> media volume;
# everything else -> React Router SSR.
upstream portfolio_frontend {
  server frontend:3000;
}
upstream portfolio_backend {
  server backend:8000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  location ^~ /media/ {
    alias /srv/media/;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400";
  }

  location ~ ^/(api|admin|static)/ {
    proxy_pass http://portfolio_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://portfolio_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection $connection_upgrade;
  }
}
