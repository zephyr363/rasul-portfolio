[project]
name = "portfolio-api"
version = "1.0.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "django>=6.0,<6.1", "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28", "psycopg[binary]>=3.2", "pillow>=11",
  "pyjwt>=2.10", "gunicorn>=23", "whitenoise>=6.9",
]
[dependency-groups]
dev = ["ruff>=0.12"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]
# S110: best-effort logout intentionally ignores a missing/expired refresh cookie.
ignore = ["S110"]
[tool.ruff.lint.per-file-ignores]
"portfolio/tests.py" = ["S105", "S106", "S107"]
