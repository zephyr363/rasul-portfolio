    <script>
      // Ранняя установка темы до первой отрисовки (без мигания). По умолчанию —
      // системная; явный выбор читается из localStorage['rasul-theme'].
      (function () {
        try {
          var stored = localStorage.getItem("rasul-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          var tm = document.querySelector('meta[name="theme-color"]');
          if (tm) tm.setAttribute("content", theme === "light" ? "#fafaf9" : "#0c0c0c");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
