# Local trial of the production topology behind a plain nginx gateway (no TLS).
# Traefik and the standalone media service are disabled via profiles; the gateway
# serves /media/ from the shared volume instead.
#
#   docker compose -p portfolio-nginx -f docker-compose.yml -f docker-compose.nginx.yml --env-file .env up -d
#
# The site is then available at http://localhost:8080 (DJANGO_DEBUG=true for plain HTTP).
services:
  traefik:
    profiles: ["traefik"]
  media:
    profiles: ["media"]
  backend:
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,gateway
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  gateway:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - media:/srv/media:ro
      - ./infra/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: [edge]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
